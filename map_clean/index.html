<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. Инициализация карты
        var map = L.map('map').setView([55.655, 37.485], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var streetsLayer = L.layerGroup().addTo(map);
        var trackLayer = L.layerGroup().addTo(map);

        // 2. Загрузка правильных улиц из OSM
        fetch('streets_clipped.json')
            .then(function(response) { return response.json(); })
            .then(function(data) {
                console.log("Данные загружены. Найдено участков:", data.features ? data.features.length : 0);
                
                if (data.features) {
                    data.features.forEach(function(feature) {
                        if (feature.coords && feature.coords.length > 0) {
                            
                            // Рисуем линию (polyline), так как это дороги
                            L.polyline(feature.coords, {
                                color: '#3b82f6', // Синий цвет, как на картах
                                weight: 3,
                                opacity: 0.7
                            }).bindTooltip(feature.name).addTo(streetsLayer);
                        }
                    });
                    console.log("Улицы успешно отрисованы!");
                }
            })
            .catch(function(error) { 
                console.error('ОШИБКА ЗАГРУЗКИ:', error); 
            });

        // 3. Функция для отрисовки треков машин (вызывается из Python)
        window.drawTrack = function(coords, carNumber) {
            trackLayer.clearLayers(); 
            if (!coords || coords.length === 0) return;
            
            var polyline = L.polyline(coords, { color: 'red', weight: 4, opacity: 0.8 }).addTo(trackLayer);
            L.marker(coords[coords.length - 1]).bindPopup("Машина: " + carNumber).addTo(trackLayer);
            
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        };
    </script>
</body>
</html>
